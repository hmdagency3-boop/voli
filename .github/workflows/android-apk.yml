name: Android APK

# Builds the Voli Android app on every push to main, or by hand from the Actions tab.
# The web interface is built first and packed inside the APK, so the app runs from the phone.
# Optional repository settings (Settings -> Secrets and variables -> Actions):
#   Variable VITE_SITE_URL           published site used for voice tickets, device checks and shared links
#                                    (defaults to https://voli-bright-journey.lovable.app)
#   Secret   ANDROID_KEYSTORE_BASE64 base64 of your .jks keystore, to also produce a signed release APK/AAB
#   Secret   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install packages
        run: bun install --frozen-lockfile || bun install

      - name: Build the interface for the app
        run: bun run build:native

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: voli-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Build signed release
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/voli.jks"
          ./gradlew --no-daemon assembleRelease bundleRelease
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/voli.jks" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out app/build/outputs/apk/release/voli-release.apk "$RUNNER_TEMP/aligned.apk"
          jarsigner -keystore "$RUNNER_TEMP/voli.jks" -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"

      - name: Upload signed release
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: voli-release
          path: |
            android/app/build/outputs/apk/release/voli-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
